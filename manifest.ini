[ABOUT]
NAME = Car Culling
AUTHOR = Claude
VERSION = 1.5.1
DESCRIPTION = Stops drawing cars nobody is driving and, optionally, all but the nearest cars. Made for online races, the nearest-cars option also works against bots.

[CORE]
LAZY = 0  ; load when the game loads and keep running, even with the window closed

; the game switches cars on again by itself, so cars are hidden again at several moments of a frame
[SIM_CALLBACKS]
UPDATE = simUpdate
FRAME_BEGIN = frameBegin

[RENDER_CALLBACKS]
OPAQUE = afterOpaque

; cars are switched on again from here, the same moment the window's buttons run in
[UI_CALLBACKS]
IN_GAME = uiFrame

[WINDOW_...]
ID = main
NAME = Car Culling
ICON = icon.png
FUNCTION_MAIN = windowMain
MIN_SIZE = 300, 420
SIZE = 340, 760
