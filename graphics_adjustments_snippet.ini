; Built-in Custom Shaders Patch options that help with many cars on screen.
;
; Where to put it: Documents\Assetto Corsa\cfg\extension\graphics_adjustments.ini
; (open the file if it exists and add / change only the lines below; or set the same
;  options in Content Manager: Settings > Custom Shaders Patch > Graphics adjustments).
; Restart the game afterwards.

[LODS]
; Show lower detail models of other cars sooner (default 1.0, range 0.2 - 3.2).
CARS_DISTANCE_MULT=0.6
; Give cars that have no lower detail models a simple one when they are far away.
FALLBACK_LODS=1
; How many such cars may keep their full model before fallback models take over (default 40).
LODLESS_LIMIT=10
; Other cars' drivers are drawn with a simple model in first person view.
DRIVER_LR_FIX=1

; ---------------------------------------------------------------------------------------
; EXPERIMENTAL (hidden, undocumented options): how many cars may be drawn at each level of
; detail in the main view. The four numbers are: full model, simplified, simplified more,
; lowest detail. The default is 2, 4, 10, 200. Lowering the last number should make the game
; stop drawing the cars beyond the nearest few dozen. To try it, remove the semicolons on
; the next two lines. If anything looks wrong, delete them again.
; [VISIBLE_CARS]
; MAIN=2, 4, 10, 24
